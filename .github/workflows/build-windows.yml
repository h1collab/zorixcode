name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Verify source
        shell: pwsh
        run: npm run verify

      - name: Build Windows installer
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zorix-Code-Windows-x64
          path: dist/Zorix-Code-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish production release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.0.0"
          $asset = Get-ChildItem "dist/Zorix-Code-Setup-*.exe" | Select-Object -First 1
          if (-not $asset) { throw "Windows installer not found" }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset.FullName --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $asset.FullName --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Zorix Code 1.0.0" --notes "Production Windows x64 installer for Zorix Code. Authentication is required through the official Zorix login before the workspace is unlocked."
          }
